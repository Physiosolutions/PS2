# Physio Cloud — Cloudflare Worker (D1 + R2 + KV)
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "physio-cloud"
main = "worker.js"
compatibility_date = "2025-01-01"

# --- D1: text / records ------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "physio-db"
database_id = "43a81faf-8c37-407e-ac47-a7f455c9cbf1"

# --- R2: photos / files ------------------------------------------------
# Requires one-time activation in the Cloudflare dashboard (R2 > Enable).
# Uncomment once the bucket exists:
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "physio-photos"

# --- KV: small config / hot cache --------------------------------------
[[kv_namespaces]]
binding = "CONFIG"
id = "54834ec684d7434eac28d446ec808102"

[vars]
# Comma-separated browser origins allowed to call this API.
# Add your Vercel preview domains if you test on them.
ALLOWED_ORIGINS = "https://psfamily.vercel.app,http://localhost:8080,http://127.0.0.1:8080"
SESSION_TTL_DAYS = "30"

# BOOTSTRAP_SECRET is a secret — do NOT put it here.
# Set it with: wrangler secret put BOOTSTRAP_SECRET
